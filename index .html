<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nguyễn Ngọc Gia Hân - N23DCPT019</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-pink-50 via-white to-blue-50 min-h-screen flex items-center justify-center p-4">
<div class="relative bg-white rounded-xl p-6 md:p-12 max-w-2xl w-full shadow-xl text-center md:text-left overflow-hidden">

  <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-pink-400 via-fuchsia-400 to-blue-500"></div>

  <h1 class="text-2xl md:text-3xl font-bold mb-4 bg-gradient-to-r from-pink-600 to-blue-600 bg-clip-text text-transparent">
    Khóa Học Lập Trình Giao Diện Web
  </h1>

  <p class="text-gray-600 mb-8 text-base md:text-lg">
    Nắm vững tư duy Mobile-First và xây dựng website chuẩn Responsive cực nhanh với Tailwind CSS.
  </p>

  <div class="flex flex-col md:flex-row gap-3">
    <!-- Nút 1: Bắt đầu ngay (gradient hồng -> xanh, nổi bật) -->
    <button class="w-full md:w-auto bg-gradient-to-r from-pink-500 to-blue-500 text-white font-semibold py-3 px-6 rounded-lg shadow-md shadow-pink-200/60 hover:from-pink-600 hover:to-blue-600 hover:shadow-lg active:scale-95 transition-all duration-300 focus:outline-none focus:ring-4 focus:ring-pink-300/50">
      Bắt đầu ngay
    </button>

    <!-- Nút 2: Tìm hiểu thêm (nền trắng, viền xanh nhạt) -->
    <button class="w-full md:w-auto bg-white text-blue-700 border-2 border-blue-100 font-semibold py-3 px-6 rounded-lg hover:bg-blue-50 hover:border-blue-200 active:scale-95 transition-all duration-300 focus:outline-none focus:ring-4 focus:ring-blue-200/50">
      Tìm hiểu thêm
    </button>
  </div>

</div>
</body>
</html>
